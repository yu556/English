<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>否定前缀 · 词缀背单词</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c1917;
      --muted: #57534e;
      --line: #d6d3d1;
      --paper: #faf7f2;
      --panel: #fffdf9;
      --side: #1f2a28;
      --side-text: #d6ebe6;
      --side-muted: #8fb3ab;
      --accent: #0f766e;
      --accent-soft: #ccfbf1;
      --danger: #b91c1c;
      --ok: #15803d;
      --shadow: 0 12px 40px rgba(28, 25, 23, 0.08);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

    body {
      font-family: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      min-height: 100dvh;
      background:
        radial-gradient(ellipse at 18% 0%, #d8f3ef 0%, transparent 40%),
        radial-gradient(ellipse at 95% 8%, #fde68a55 0%, transparent 32%),
        linear-gradient(180deg, #f3efe6 0%, var(--paper) 50%, #ebe6dc 100%);
    }

    .app {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      min-height: 100dvh;
    }

    /* —— Course sidebar —— */
    .course-side {
      background: var(--side);
      color: var(--side-text);
      padding: calc(18px + var(--safe-t)) 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: sticky;
      top: 0;
      height: 100dvh;
      overflow: auto;
    }

    .course-side .logo {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      padding: 4px 8px;
    }

    .course-side .logo span {
      display: block;
      margin-top: 4px;
      font-family: "IBM Plex Sans", sans-serif;
      font-size: 0.78rem;
      color: var(--side-muted);
      font-weight: 500;
    }

    .course-label {
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--side-muted);
      padding: 0 8px;
      margin-bottom: 8px;
    }

    .course-nav { display: flex; flex-direction: column; gap: 6px; }

    .course-nav a {
      display: block;
      text-decoration: none;
      color: var(--side-text);
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .course-nav a small {
      display: block;
      margin-top: 3px;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--side-muted);
    }

    .course-nav a:hover { background: rgba(255,255,255,.06); }
    .course-nav a.active {
      background: rgba(20, 184, 166, 0.18);
      border-color: rgba(94, 234, 212, 0.35);
      color: #99f6e4;
    }
    .course-nav a.active small { color: #5eead4; }

    .side-note {
      margin-top: auto;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,.05);
      font-size: 0.78rem;
      color: var(--side-muted);
      line-height: 1.45;
    }

    /* —— Main —— */
    .main-col {
      min-width: 0;
      padding: 18px 16px calc(28px + var(--safe-b));
    }

    .wrap { max-width: 920px; margin: 0 auto; }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .brand h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(1.45rem, 3.6vw, 2rem);
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .brand p {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .mobile-course-btn {
      display: none;
      align-items: center;
      gap: 8px;
      font: inherit;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
    }

    .shell {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fffefb, #f8f4ec);
    }

    .modes {
      display: flex;
      gap: 4px;
      background: #efeae1;
      padding: 4px;
      border-radius: 12px;
    }

    .modes button,
    .chip,
    .btn,
    .speak-btn {
      font: inherit;
      cursor: pointer;
      border: none;
    }

    .modes button {
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 0.85rem;
      font-weight: 600;
      min-height: 40px;
    }

    .modes button.active {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    .stats {
      font-size: 0.8rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .toolbar-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .hide-btn {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      min-height: 36px;
    }

    .hide-btn.active {
      background: #fff7ed;
      border-color: #fdba74;
      color: #c2410c;
    }

    .filters {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }

    .chip {
      flex: 0 0 auto;
      background: #f5f0e8;
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      min-height: 36px;
    }

    .chip.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: #99f6e4;
    }

    .main { padding: 14px 12px 18px; min-height: 420px; }

    .lesson-banner {
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #f0fdfa;
      border: 1px solid #99f6e4;
      color: #115e59;
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .lesson-banner strong {
      font-family: "IBM Plex Mono", monospace;
    }

    /* Browse */
    .group { margin-bottom: 20px; }
    .group:last-child { margin-bottom: 0; }

    .group-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .group-head h2 {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 1.05rem;
      color: var(--accent);
    }

    .group-head span { color: var(--muted); font-size: 0.82rem; }

    .pair-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 8px;
    }

    .pair {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }

    .pair.known {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }

    .pair-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: start;
    }

    .pair .side { min-width: 0; }
    .pair .en {
      font-weight: 600;
      font-size: 0.98rem;
      word-break: break-word;
      line-height: 1.3;
    }
    .pair .pos-badge {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 2px 7px;
      border-radius: 999px;
    }
    .pair .meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .pair .ipa {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.78rem;
      color: #0f766e;
      letter-spacing: 0.01em;
      margin-top: 3px;
    }
    .pair .zh { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }

    /* 只看中文 */
    .main.hide-en .pair .en,
    .main.hide-en .pair .meta-row,
    .main.hide-en .pair .ipa,
    .main.hide-en .pair .arrow,
    .main.hide-en .pair-actions {
      display: none !important;
    }

    .main.hide-en .pair .zh {
      color: var(--ink);
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.45;
      margin-top: 0;
    }

    .main.hide-en .pair-row {
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .main.hide-en .pair {
      cursor: pointer;
      position: relative;
    }

    .main.hide-en .pair.revealed .en,
    .main.hide-en .pair.revealed .meta-row,
    .main.hide-en .pair.revealed .ipa,
    .main.hide-en .pair.revealed .pair-actions {
      display: flex !important;
    }

    .main.hide-en .pair.revealed .ipa {
      display: block !important;
    }

    .main.hide-en .pair.revealed .en {
      display: block !important;
    }

    .main.hide-en .pair.revealed .zh {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 400;
      margin-top: 2px;
    }

    .main.hide-en .pair.revealed .arrow {
      display: block !important;
    }

    .main.hide-en .pair.revealed .pair-row {
      grid-template-columns: 1fr auto 1fr;
    }

    @media (max-width: 860px) {
      .main.hide-en .pair-row,
      .main.hide-en .pair.revealed .pair-row {
        grid-template-columns: 1fr;
      }
      .main.hide-en .pair.revealed .arrow {
        display: none !important;
      }
    }
    .flash-ipa {
      margin-top: 10px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 1rem;
      color: #0f766e;
    }
    .pair .arrow {
      color: #a8a29e;
      font-size: 0.85rem;
      padding-top: 4px;
      text-align: center;
    }

    .pair-actions {
      display: flex;
      justify-content: flex-end;
      border-top: 1px dashed #e7e5e4;
      padding-top: 8px;
    }

    .speak-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      background: #ecfdf5;
      color: var(--accent);
      border: 1px solid #99f6e4;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1;
      padding: 0;
    }

    .speak-btn:active { transform: scale(.97); }
    .speak-btn.playing { background: var(--accent); color: #fff; border-color: var(--accent); }

    .mark-btn {
      font: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 7px 4px;
      min-height: 34px;
    }

    /* Flash / quiz */
    .study-wrap {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .progress-bar {
      height: 6px;
      background: #e7e5e4;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0d9488, #14b8a6);
      transition: width .25s ease;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .flash-panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      padding: 20px 16px;
      cursor: pointer;
      user-select: none;
      text-align: center;
    }

    .flash-panel.open {
      background: #f0fdfa;
      cursor: default;
    }

    .flash-panel .flash-main {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .flash-panel .flash-detail {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .tag {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .word {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(1.65rem, 5vw, 2.3rem);
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .pos { margin-top: 8px; color: var(--muted); font-size: 0.9rem; }
    .meaning { font-size: 1.2rem; font-weight: 600; margin-top: 6px; line-height: 1.45; }
    .base-hint { margin-top: 14px; color: var(--muted); font-size: 0.9rem; line-height: 1.45; }
    .flash-pair {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: start;
      text-align: left;
    }
    .flash-pair .fp-arrow {
      color: #a8a29e;
      padding-top: 10px;
      font-size: 1rem;
      text-align: center;
    }
    .flash-pair .fp-word {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(1.15rem, 3.6vw, 1.55rem);
      letter-spacing: -0.02em;
      line-height: 1.2;
      word-break: break-word;
    }
    .flash-pair .fp-ipa {
      margin-top: 6px;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.78rem;
      color: #0f766e;
    }
    .flash-pair .fp-zh {
      margin-top: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.45;
      color: var(--ink);
    }
    .meanings-line {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.45;
      margin: 8px 0 4px;
    }

    .detail-box {
      margin-top: 14px;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      text-align: left;
      font-size: 0.88rem;
      line-height: 1.5;
      color: #44403c;
    }

    .detail-box .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 0;
      border-top: 1px dashed #d6d3d1;
    }

    .detail-box .row:first-child { border-top: none; }
    .detail-box .k { color: var(--muted); flex: 0 0 auto; }
    .detail-box .v { font-weight: 600; text-align: right; word-break: break-word; }

    .related-box {
      margin-top: 12px;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid #99f6e4;
      text-align: left;
    }

    .related-box .rb-title {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .related-item {
      display: grid;
      gap: 2px;
      padding: 8px 0;
      border-top: 1px dashed #e7e5e4;
    }

    .related-item:first-of-type { border-top: none; padding-top: 0; }
    .related-item .ri-label { font-size: 0.72rem; color: var(--muted); }
    .related-item .ri-word { font-weight: 700; font-size: 1rem; }
    .related-item .ri-ipa {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.78rem;
      color: #0f766e;
    }
    .related-item .ri-zh { font-size: 0.82rem; color: #44403c; line-height: 1.4; }
    .example { margin-top: 10px; font-size: 0.88rem; color: #44403c; line-height: 1.5; max-width: 34ch; }
    .hint-tap { margin-top: 16px; font-size: 0.78rem; color: #a8a29e; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      position: relative;
      z-index: 2;
    }

    .actions.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
    .actions.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

    .btn {
      border-radius: 12px;
      padding: 13px 10px;
      font-weight: 600;
      font-size: 0.88rem;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      min-height: 48px;
    }

    .btn:active { transform: scale(.98); }
    .btn.ghost { background: #f5f0e8; }
    .btn.ok { background: #dcfce7; border-color: #86efac; color: var(--ok); }
    .btn.bad { background: #fee2e2; border-color: #fca5a5; color: var(--danger); }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .quiz-prompt { text-align: center; margin-bottom: 14px; }
    .quiz-prompt .big {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(1.45rem, 4vw, 1.95rem);
      margin: 8px 0 4px;
    }

    .choices { display: grid; gap: 8px; }

    .choice {
      text-align: left;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .choice .choice-speak {
      flex: 0 0 auto;
      font-size: 0.75rem;
      color: var(--accent);
      background: var(--accent-soft);
      border: none;
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .choice:hover:not(:disabled) { border-color: #99f6e4; background: #f0fdfa; }
    .choice.correct { background: #dcfce7; border-color: #86efac; color: var(--ok); }
    .choice.wrong { background: #fee2e2; border-color: #fca5a5; color: var(--danger); }
    .choice:disabled { cursor: default; }

    .feedback {
      margin-top: 10px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
      min-height: 1.4em;
    }

    .spell-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .spell-input {
      width: 100%;
      font: inherit;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1.5px solid var(--line);
      background: #fff;
      color: var(--ink);
      outline: none;
      min-height: 52px;
    }

    .spell-input:focus {
      border-color: #5eead4;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .spell-input.ok {
      border-color: #86efac;
      background: #f0fdf4;
      color: var(--ok);
    }

    .spell-input.bad {
      border-color: #fca5a5;
      background: #fef2f2;
      color: var(--danger);
    }

    .spell-answer {
      text-align: center;
      font-family: Fraunces, Georgia, serif;
      font-size: 1.35rem;
      margin-top: 4px;
    }

    .empty { text-align: center; color: var(--muted); padding: 48px 12px; }
    .done-box { text-align: center; padding: 36px 12px; }
    .done-box h3 {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.55rem;
      margin-bottom: 8px;
    }
    .done-box p { color: var(--muted); margin-bottom: 16px; }

    /* Mobile course sheet */
    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(28, 25, 23, 0.45);
      z-index: 40;
    }
    .backdrop.open { display: block; }

    .course-sheet {
      display: none;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 50;
      background: #1f2a28;
      color: var(--side-text);

      { prefix: "de-", word: "defame", pos: "v.", meaning: "诽谤；中伤", base: "fame", baseMeaning: "名声；名望", ipa: "/dɪˈfeɪm/", baseIpa: "/feɪm/" },

      { prefix: "mis-", word: "misunderstand", pos: "v.", meaning: "误解；误会", base: "understand", baseMeaning: "理解；明白；懂", ipa: "/ˌmɪsʌndəˈstænd/", baseIpa: "/ˌʌndəˈstænd/", example: "Some of you may misunderstand what I'm asking." },
      { prefix: "mis-", word: "misuse", pos: "v.", meaning: "误用；滥用", base: "use", baseMeaning: "使用；利用", ipa: "/ˌmɪsˈjuːz/", baseIpa: "/juːz/" },
      { prefix: "mis-", word: "mismatch", pos: "v.", meaning: "误配；不匹配；错配", base: "match", baseMeaning: "匹配；相配；比赛", ipa: "/ˈmɪsmætʃ/", baseIpa: "/mætʃ/" },
      { prefix: "mis-", word: "misspell", pos: "v.", meaning: "拼错；拼写错误", base: "spell", baseMeaning: "拼写；拼出", ipa: "/ˌmɪsˈspel/", baseIpa: "/spel/" },
      { prefix: "mis-", word: "mislead", pos: "v.", meaning: "误导；欺骗", base: "lead", baseMeaning: "引导；带领；导致", ipa: "/ˌmɪsˈliːd/", baseIpa: "/liːd/" },
      { prefix: "mis-", word: "misjudge", pos: "v.", meaning: "误判；判断错误", base: "judge", baseMeaning: "判断；审判；评判", ipa: "/ˌmɪsˈdʒʌdʒ/", baseIpa: "/dʒʌdʒ/" },
    ];

    const PREFIXES = ["all", "in-", "im-", "ir-", "il-", "un-", "dis-", "de-", "mis-"];
    const PREFIX_NOTE = {
      "in-": "常置于形容词或名词前，表示否定或相反",
      "im-": "常用于 p / m / b 开头的词根前",
      "ir-": "常用于 r 开头的词根前",
      "il-": "常用于 l 开头的词根前",
      "un-": "可用于形容词、名词、动词",
      "dis-": "否定或相反；注意 disinterested ≠ uninterested",
      "de-": "常置于动词前，表示去除或否定",
      "mis-": "常置于动词前，表示错误",
    };

    const STORE_KEY = "neg-affix-known-v1";
    const HIDE_KEY = "neg-affix-hide-en-v1";
    let audioEl = null;
    let speakToken = 0;

    const state = {
      mode: "browse",
      prefix: "all",
      hideEn: localStorage.getItem(HIDE_KEY) === "1",
      known: loadKnown(),
      flash: { queue: [], index: 0, flipped: false },
      quiz: { queue: [], index: 0, answered: false, choices: [], score: 0, picked: null },
      spell: { queue: [], index: 0, answered: false, correct: false, input: "", score: 0, hint: false },
    };

    function loadKnown() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        return raw ? new Set(JSON.parse(raw)) : new Set();
      } catch {
        return new Set();
      }
    }

    function saveKnown() {
      localStorage.setItem(STORE_KEY, JSON.stringify([...state.known]));
    }

    function filteredPairs() {
      return state.prefix === "all"
        ? WORDS.slice()
        : WORDS.filter((w) => w.prefix === state.prefix);
    }

    // 闪卡 / 测验 / 拼写：每个英文词独立，不再成对出题
    function flatItems(pairs) {
      const map = new Map();
      const add = (item) => {
        if (map.has(item.word)) {
          const ex = map.get(item.word);
          for (const r of item.related) {
            if (!ex.related.some((x) => x.word === r.word)) ex.related.push(r);
          }
          if (!ex.note && item.note) ex.note = item.note;
          if (!ex.example && item.example) ex.example = item.example;
          return;
        }
        map.set(item.word, item);
      };

      for (const p of pairs) {
        add({
          word: p.base,
          meaning: p.baseMeaning,
          ipa: p.baseIpa || "",
          pos: p.pos,
          prefix: p.prefix,
          role: "base",
          related: [{
            word: p.word,
            meaning: p.meaning,
            ipa: p.ipa || "",
            pos: p.pos,
            label: `否定形式 ${p.prefix}`,
          }],
        });
        add({
          word: p.word,
          meaning: p.meaning,
          ipa: p.ipa || "",
          pos: p.pos,
          prefix: p.prefix,
          role: "affixed",
          note: p.note,
          example: p.example,
          related: [{
            word: p.base,
            meaning: p.baseMeaning,
            ipa: p.baseIpa || "",
            pos: p.pos,
            label: "原词",
          }],
        });
      }
      return [...map.values()];
    }

    function filteredFlat() {
      return flatItems(filteredPairs());
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Single audio source only — avoid TTS + online voice playing twice
    function speak(text, btn) {
      if (!text) return;
      const token = ++speakToken;

      document.querySelectorAll(".speak-btn.playing, .btn.playing").forEach((b) => b.classList.remove("playing"));
      if (btn) btn.classList.add("playing");

      const clearPlaying = () => {
        if (token !== speakToken) return;
        if (btn) btn.classList.remove("playing");
      };

      if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (!audioEl) audioEl = new Audio();
      try {
        audioEl.pause();
        audioEl.currentTime = 0;
      } catch (_) {}

      audioEl.onended = clearPlaying;
      audioEl.onerror = clearPlaying;
      audioEl.src = "https://dict.youdao.com/dictvoice?audio=" + encodeURIComponent(text) + "&type=2";
      audioEl.play().catch(clearPlaying);
    }

    function updateStats() {
      const pairs = filteredPairs();
      const flat = flatItems(pairs);
      const known = flat.filter((w) => state.known.has(w.word)).length;
      const allFlat = flatItems(WORDS).length;
      document.getElementById("stats").textContent =
        `已掌握 ${known}/${flat.length} · 单词 ${allFlat}`;
    }

    function renderFilters() {
      const el = document.getElementById("filters");
      el.innerHTML = PREFIXES.map((p) => {
        const pairs = p === "all" ? WORDS : WORDS.filter((w) => w.prefix === p);
        const count = flatItems(pairs).length;
        const label = p === "all" ? `全部 ${count}` : `${p}${count}`;
        return `<button type="button" class="chip ${state.prefix === p ? "active" : ""}" data-prefix="${p}">${label}</button>`;
      }).join("");
    }

    function syncHideBtn() {
      const btn = document.getElementById("hideEnBtn");
      if (!btn) return;
      const show = state.mode === "browse";
      btn.hidden = !show;
      btn.classList.toggle("active", state.hideEn);
      btn.setAttribute("aria-pressed", state.hideEn ? "true" : "false");
      btn.textContent = state.hideEn ? "显示英文" : "只看中文";
    }

    function render() {
      updateStats();
      syncHideBtn();
      const main = document.getElementById("main");
      main.classList.toggle("hide-en", state.mode === "browse" && state.hideEn);
      if (state.mode === "browse") main.innerHTML = renderBrowse();
      else if (state.mode === "flash") main.innerHTML = renderFlash();
      else if (state.mode === "quiz") main.innerHTML = renderQuiz();
      else main.innerHTML = renderSpell();

      if (state.mode === "spell" && !state.spell.answered) {
        const input = document.getElementById("spell-input");
        if (input) {
          input.value = state.spell.input || "";
          requestAnimationFrame(() => input.focus());
        }
      }
    }

    function speakBtn(word) {
      return `<button type="button" class="speak-btn" data-speak="${word}" aria-label="朗读 ${word}">🔊</button>`;
    }

    function zhText(s) {
      return String(s || "").replace(/；/g, " · ");
    }

    function relatedHtml(item) {
      if (!item.related || !item.related.length) return "";
      return `
        <div class="related-box">
          <div class="rb-title">变形 / 相关</div>
          ${item.related.map((r) => `
            <div class="related-item">
              <div class="ri-label">${r.label || "相关词"}</div>
              <div class="ri-word">${r.word} <span class="pos-badge">${r.pos || item.pos}</span>
                <button type="button" class="speak-btn" data-speak="${r.word}" aria-label="朗读 ${r.word}" style="width:28px;height:28px;font-size:.75rem">🔊</button>
              </div>
              <div class="ri-ipa">${r.ipa || ""}</div>
              <div class="ri-zh">${zhText(r.meaning)}</div>
            </div>
          `).join("")}
        </div>`;
    }

    function renderBrowse() {
      const list = filteredPairs();
      if (!list.length) return `<div class="empty">这个词缀下没有词。</div>`;

      const banner = state.hideEn
        ? `<div class="lesson-banner">已隐藏英文，只显示中文。点卡片可临时查看英文答案。</div>`
        : state.prefix === "all"
        ? `<div class="lesson-banner">浏览仍按讲义成对展示。闪卡 / 测验 / 拼写按<strong>单个单词</strong>练习。</div>`
        : `<div class="lesson-banner"><strong>${state.prefix}</strong> · ${PREFIX_NOTE[state.prefix] || ""}</div>`;

      const groups = {};
      for (const w of list) (groups[w.prefix] ||= []).push(w);

      return banner + Object.entries(groups).map(([prefix, words]) => `
        <section class="group">
          <div class="group-head">
            <h2>${prefix}</h2>
            <span>${words.length} 组</span>
          </div>
          <div class="pair-list">
            ${words.map((w) => `
              <article class="pair ${state.known.has(w.word) ? "known" : ""}">
                <div class="pair-row">
                  <div class="side">
                    <div class="en">${w.base}</div>
                    <div class="meta-row">${speakBtn(w.base)} <span class="pos-badge">${w.pos}</span></div>
                    <div class="ipa">${w.baseIpa || ""}</div>
                    <div class="zh">${zhText(w.baseMeaning)}</div>
                  </div>
                  <div class="arrow">→</div>
                  <div class="side">
                    <div class="en">${w.word}</div>
                    <div class="meta-row">${speakBtn(w.word)} <span class="pos-badge">${w.pos}</span></div>
                    <div class="ipa">${w.ipa || ""}</div>
                    <div class="zh">${zhText(w.meaning)}</div>
                  </div>
                </div>
                <div class="pair-actions">
                  <button type="button" class="mark-btn" data-toggle="${w.word}">
                    ${state.known.has(w.word) ? "取消掌握" : "标记掌握"}
                  </button>
                </div>
              </article>
            `).join("")}
          </div>
        </section>
      `).join("");
    }

    function ensureFlashQueue() {
      if (!state.flash.queue.length) {
        state.flash.queue = shuffle(filteredFlat());
        state.flash.index = 0;
        state.flash.flipped = false;
      }
    }

    function renderFlash() {
      ensureFlashQueue();
      const q = state.flash.queue;
      if (!q.length) return `<div class="empty">没有可背的词，换个词缀试试。</div>`;

      if (state.flash.index >= q.length) {
        return `
          <div class="done-box">
            <h3>本轮闪卡完成</h3>
            <p>共过了 ${q.length} 个词。</p>
            <button type="button" class="btn primary" data-flash-restart>再来一轮</button>
          </div>`;
      }

      const w = q[state.flash.index];
      const pct = Math.round((state.flash.index / q.length) * 100);
      const roleLabel = w.role === "base" ? "原词" : `否定 ${w.prefix}`;

      return `
        <div class="study-wrap">
          <div class="progress-bar"><i style="width:${pct}%"></i></div>
          <div class="meta-row">
            <span>${state.flash.index + 1} / ${q.length}</span>
            <span>${roleLabel} · ${w.pos}</span>
          </div>
          <div class="flash-panel ${state.flash.flipped ? "open" : ""}" id="flash-card" role="button" tabindex="0" aria-expanded="${state.flash.flipped ? "true" : "false"}" aria-label="查看详情和变形">
            <div class="flash-main">
              <div class="tag">${roleLabel} · ${w.pos}</div>
              <div class="word">${w.word}</div>
              <div class="flash-ipa">${w.ipa || ""}</div>
              ${!state.flash.flipped ? `<div class="hint-tap">点开看详情和变形</div>` : ""}
            </div>
            ${state.flash.flipped ? `
              <div class="flash-detail">
                <div class="meaning">${zhText(w.meaning)}</div>
                <div class="detail-box">
                  <div class="row"><span class="k">词性</span><span class="v">${w.pos}</span></div>
                  <div class="row"><span class="k">音标</span><span class="v">${w.ipa || "—"}</span></div>
                  <div class="row"><span class="k">类型</span><span class="v">${roleLabel}</span></div>
                </div>
                ${relatedHtml(w)}
                ${w.note ? `<div class="example">${w.note}</div>` : ""}
                ${w.example ? `<div class="example">“${w.example}”</div>` : ""}
              </div>` : ""}
          </div>
          <div class="actions cols-3">
            <button type="button" class="btn bad" data-flash-again>再练</button>
            <button type="button" class="btn ghost" data-speak="${w.word}">🔊 发音</button>
            <button type="button" class="btn ok" data-flash-know>认识</button>
          </div>
        </div>`;
    }

    function ensureQuizQueue() {
      if (!state.quiz.queue.length) {
        state.quiz.queue = shuffle(filteredFlat());
        state.quiz.index = 0;
        state.quiz.answered = false;
        state.quiz.score = 0;
        state.quiz.picked = null;
        state.quiz.choices = makeChoices(state.quiz.queue[0]);
      }
    }

    function makeChoices(correct) {
      if (!correct) return [];
      const pool = filteredFlat().filter((w) => w.word !== correct.word);
      return shuffle([correct, ...shuffle(pool).slice(0, 3)]);
    }

    function renderQuiz() {
      ensureQuizQueue();
      const q = state.quiz.queue;
      if (!q.length) return `<div class="empty">没有可测的词。</div>`;

      if (state.quiz.index >= q.length) {
        return `
          <div class="done-box">
            <h3>测验结束</h3>
            <p>正确 ${state.quiz.score} / ${q.length}</p>
            <button type="button" class="btn primary" data-quiz-restart>再测一轮</button>
          </div>`;
      }

      const w = q[state.quiz.index];
      const pct = Math.round((state.quiz.index / q.length) * 100);
      const roleLabel = w.role === "base" ? "原词" : `否定 ${w.prefix}`;

      return `
        <div class="study-wrap">
          <div class="progress-bar"><i style="width:${pct}%"></i></div>
          <div class="meta-row">
            <span>${state.quiz.index + 1} / ${q.length}</span>
            <span>得分 ${state.quiz.score}</span>
          </div>
          <div class="quiz-prompt">
            <div class="tag" style="display:inline-block">${roleLabel} · ${w.pos}</div>
            <div class="meanings-line">${zhText(w.meaning)}</div>
          </div>
          <div class="choices">
            ${state.quiz.choices.map((c) => {
              let cls = "choice";
              if (state.quiz.answered) {
                if (c.word === w.word) cls += " correct";
                else if (c.word === state.quiz.picked) cls += " wrong";
              }
              return `
                <button type="button" class="${cls}" data-pick="${c.word}" ${state.quiz.answered ? "disabled" : ""}>
                  <span>${c.word} <small style="color:var(--muted);font-weight:500">${c.pos}</small></span>
                  <span class="choice-speak" data-speak="${c.word}" data-stop>🔊</span>
                </button>`;
            }).join("")}
          </div>
          <div class="feedback">
            ${state.quiz.answered
              ? (state.quiz.picked === w.word
                  ? "正确"
                  : `正确答案是 <strong>${w.word}</strong> ${w.ipa || ""}${w.note ? " · " + w.note : ""}`)
              : "根据中文意思选择对应英文单词"}
          </div>
          ${state.quiz.answered
            ? `<div class="actions">
                <button type="button" class="btn ghost" data-speak="${w.word}">🔊 听正确发音</button>
                <button type="button" class="btn primary" data-quiz-next>下一题</button>
              </div>`
            : ""}
        </div>`;
    }

    function ensureSpellQueue() {
      if (!state.spell.queue.length) {
        state.spell.queue = shuffle(filteredFlat());
        state.spell.index = 0;
        state.spell.answered = false;
        state.spell.correct = false;
        state.spell.input = "";
        state.spell.score = 0;
        state.spell.hint = false;
      }
    }

    function normSpell(s) {
      return String(s || "").trim().toLowerCase().replace(/\s+/g, "");
    }

    function renderSpell() {
      ensureSpellQueue();
      const q = state.spell.queue;
      if (!q.length) return `<div class="empty">没有可拼写的词。</div>`;

      if (state.spell.index >= q.length) {
        return `
          <div class="done-box">
            <h3>拼写结束</h3>
            <p>正确 ${state.spell.score} / ${q.length}</p>
            <button type="button" class="btn primary" data-spell-restart>再拼一轮</button>
          </div>`;
      }

      const w = q[state.spell.index];
      const pct = Math.round((state.spell.index / q.length) * 100);
      const inputCls = !state.spell.answered
        ? ""
        : state.spell.correct
        ? "ok"
        : "bad";
      const roleLabel = w.role === "base" ? "原词" : `否定 ${w.prefix}`;

      return `
        <div class="study-wrap">
          <div class="progress-bar"><i style="width:${pct}%"></i></div>
          <div class="meta-row">
            <span>${state.spell.index + 1} / ${q.length}</span>
            <span>得分 ${state.spell.score}</span>
          </div>
          <div class="quiz-prompt">
            <div class="tag" style="display:inline-block">${roleLabel} · ${w.pos}</div>
            <div class="meanings-line">${zhText(w.meaning)}</div>
            ${state.spell.hint ? `<div class="flash-ipa">${w.ipa || ""}</div>` : ""}
          </div>
          <form class="spell-form" id="spell-form" autocomplete="off">
            <input
              id="spell-input"
              class="spell-input ${inputCls}"
              type="text"
              enterkeyhint="done"
              autocapitalize="off"
              autocomplete="off"
              autocorrect="off"
              spellcheck="false"
              placeholder="输入英文拼写"
              ${state.spell.answered ? "readonly" : ""}
              value=""
            />
            ${!state.spell.answered
              ? `<div class="actions cols-3">
                  <button type="button" class="btn ghost" data-spell-hint>提示</button>
                  <button type="button" class="btn ghost" data-speak="${w.word}">🔊</button>
                  <button type="button" class="btn primary" data-spell-check>检查</button>
                </div>`
              : ""}
          </form>
          <div class="feedback">
            ${state.spell.answered
              ? (state.spell.correct
                  ? `正确 · ${w.ipa || ""}`
                  : `正确答案是 <strong>${w.word}</strong> ${w.ipa || ""}`)
              : "根据中文意思写出英文单词"}
          </div>
          ${state.spell.answered
            ? `<div class="spell-answer">${w.word}</div>
              <div class="actions" style="grid-template-columns:1fr 1fr">
                <button type="button" class="btn ghost" data-speak="${w.word}">🔊 发音</button>
                <button type="button" class="btn primary" data-spell-next>下一题</button>
              </div>`
            : ""}
        </div>`;
    }

    function checkSpell() {
      if (state.spell.answered) return;
      const w = state.spell.queue[state.spell.index];
      if (!w) return;
      const input = document.getElementById("spell-input");
      const typed = input ? input.value : state.spell.input;
      state.spell.input = typed;
      state.spell.answered = true;
      state.spell.correct = normSpell(typed) === normSpell(w.word);
      if (state.spell.correct) {
        state.spell.score += 1;
        state.known.add(w.word);
      } else {
        state.known.delete(w.word);
      }
      saveKnown();
      speak(w.word);
      render();
    }

    // Course sheet (mobile)
    const sheet = document.getElementById("courseSheet");
    const backdrop = document.getElementById("backdrop");

    function openSheet() {
      sheet.hidden = false;
      backdrop.hidden = false;
      requestAnimationFrame(() => {
        sheet.classList.add("open");
        backdrop.classList.add("open");
      });
    }

    function closeSheet() {
      sheet.classList.remove("open");
      backdrop.classList.remove("open");
      setTimeout(() => {
        sheet.hidden = true;
        backdrop.hidden = true;
      }, 280);
    }

    document.getElementById("openCourse").addEventListener("click", openSheet);
    backdrop.addEventListener("click", closeSheet);

    document.getElementById("hideEnBtn").addEventListener("click", () => {
      state.hideEn = !state.hideEn;
      localStorage.setItem(HIDE_KEY, state.hideEn ? "1" : "0");
      render();
    });

    document.querySelector(".modes").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-mode]");
      if (!btn) return;
      state.mode = btn.dataset.mode;
      document.querySelectorAll(".modes button").forEach((b) => b.classList.toggle("active", b === btn));
      state.flash.queue = [];
      state.quiz.queue = [];
      state.spell.queue = [];
      render();
    });

    document.getElementById("filters").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-prefix]");
      if (!btn) return;
      state.prefix = btn.dataset.prefix;
      state.flash.queue = [];
      state.quiz.queue = [];
      state.spell.queue = [];
      renderFilters();
      render();
    });

    document.getElementById("main").addEventListener("click", (e) => {
      const speakEl = e.target.closest("[data-speak]");
      if (speakEl) {
        e.preventDefault();
        e.stopPropagation();
        const btn = speakEl.classList.contains("speak-btn") || speakEl.classList.contains("btn") || speakEl.classList.contains("choice-speak")
          ? speakEl
          : null;
        speak(speakEl.dataset.speak, btn);
        return;
      }

      const toggle = e.target.closest("[data-toggle]");
      if (toggle) {
        const word = toggle.dataset.toggle;
        if (state.known.has(word)) state.known.delete(word);
        else state.known.add(word);
        saveKnown();
        render();
        return;
      }

      // 只看中文时：点卡片临时显示/隐藏英文
      if (state.mode === "browse" && state.hideEn) {
        const pair = e.target.closest(".pair");
        if (pair && !e.target.closest("[data-toggle],[data-speak]")) {
          pair.classList.toggle("revealed");
          return;
        }
      }

      if (e.target.closest("#flash-card") && !e.target.closest("[data-speak]") && !state.flash.flipped) {
        state.flash.flipped = true;
        const cur = state.flash.queue[state.flash.index];
        if (cur) speak(cur.word);
        render();
        return;
      }

      if (e.target.closest("[data-flash-restart]")) {
        state.flash.queue = [];
        render();
        return;
      }

      if (e.target.closest("[data-flash-again]")) {
        const q = state.flash.queue;
        const cur = q[state.flash.index];
        if (cur) {
          state.known.delete(cur.word);
          saveKnown();
          q.push(cur);
        }
        state.flash.index += 1;
        state.flash.flipped = false;
        render();
        return;
      }

      if (e.target.closest("[data-flash-know]")) {
        const cur = state.flash.queue[state.flash.index];
        if (cur) {
          state.known.add(cur.word);
          saveKnown();
        }
        state.flash.index += 1;
        state.flash.flipped = false;
        render();
        return;
      }

      const pick = e.target.closest("[data-pick]");
      if (pick && !state.quiz.answered && !e.target.closest("[data-stop]")) {
        const w = state.quiz.queue[state.quiz.index];
        state.quiz.picked = pick.dataset.pick;
        state.quiz.answered = true;
        if (state.quiz.picked === w.word) {
          state.quiz.score += 1;
          state.known.add(w.word);
        } else {
          state.known.delete(w.word);
        }
        saveKnown();
        speak(w.word);
        render();
        return;
      }

      if (e.target.closest("[data-quiz-next]")) {
        state.quiz.index += 1;
        state.quiz.answered = false;
        state.quiz.picked = null;
        state.quiz.choices = makeChoices(state.quiz.queue[state.quiz.index]);
        render();
        return;
      }

      if (e.target.closest("[data-quiz-restart]")) {
        state.quiz.queue = [];
        render();
        return;
      }

      if (e.target.closest("[data-spell-hint]")) {
        state.spell.hint = true;
        render();
        return;
      }

      if (e.target.closest("[data-spell-check]")) {
        checkSpell();
        return;
      }

      if (e.target.closest("[data-spell-next]")) {
        state.spell.index += 1;
        state.spell.answered = false;
        state.spell.correct = false;
        state.spell.input = "";
        state.spell.hint = false;
        render();
        return;
      }

      if (e.target.closest("[data-spell-restart]")) {
        state.spell.queue = [];
        render();
      }
    });

    document.getElementById("main").addEventListener("submit", (e) => {
      if (!e.target.closest("#spell-form")) return;
      e.preventDefault();
      checkSpell();
    });

    document.getElementById("main").addEventListener("input", (e) => {
      if (e.target.id !== "spell-input") return;
      state.spell.input = e.target.value;
    });

    renderFilters();
    render();
  </script>
</body>
</html>
